---
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  tox-lint:
    name: Linting Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup python for lint environment
        uses: actions/setup-python@v7

      - name: Install tox-gh
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox-gh

      - name: Setup test suite
        run: tox r -vv --notest

      - name: Run linting suite
        run: tox r -e lint --skip-pkg-install
        env:
          PYTEST_ADDOPTS: "-vv --durations=10"

  tox-fix:
    name: Fixing Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup python for fix environment
        uses: actions/setup-python@v7

      - name: Install tox-gh
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox-gh

      - name: Setup test suite
        run: tox r -vv --notest

      - name: Run fixing suite
        run: tox r -e fix --skip-pkg-install
        env:
          PYTEST_ADDOPTS: "-vv --durations=10"

  tox-testing:
    name: Testing Code Base on Python ${{ matrix.py }}
    runs-on: ubuntu-latest
    needs:
      - tox-lint
      - tox-fix
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.14"
          - "3.13"
          - "3.12"
    steps:
      - name: Setup python for test ${{ matrix.py }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py }}

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install tox-gh
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox-gh

      - name: Setup test suite
        run: tox r -vv --notest

      - name: Run test suite
        run: tox r -e ${{ matrix.py }} --skip-pkg-install
        env:
          PYTEST_ADDOPTS: "-vv --durations=10"
