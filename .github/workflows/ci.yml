---
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  tox:
    name: Test on Python ${{ matrix.py }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
    steps:
      - name: Setup python for test ${{ matrix.py }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py }}

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install tox-gh
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox-gh

      - name: Setup test suite
        run: tox r -vv --notest

      - name: Run test suite
        run: tox r --skip-pkg-install
        env:
          PYTEST_ADDOPTS: >-
            -vv --durations=10
            ${{ matrix.py == '3.14' && '--cov-report=xml:coverage.xml' || '' }}

      - name: Upload code coverage report
        if: matrix.py == '3.14'
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest

  lint:
    name: Linting Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 flake8-bugbear flake8-docstrings flake8-github-annotations yamllint

      - name: Lint with yamllint
        run: |
          yamllint . --format github

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --format github
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --format github
